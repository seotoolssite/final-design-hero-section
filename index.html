<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GuestAnchor — Diagram Final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #012674;      /* exact color picked from your hero section screenshot */
    --bg2: #0B3B9E;
    --text: #F4F6FB;

    --c-publisher: #D670FF;   /* lighter shade for stronger perceived glow */
    --c-content:   #8FFF1A;   /* swapped with Editorial Link */
    --c-editorial: #FF4F9E;   /* reverted to final17's color */
    --c-website:   #FFD700;   /* pure gold — genuinely brighter against the dark background */
    --c-authority: #00FFFF;   /* pure cyan, as requested */
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at 70% 30%, var(--bg2), var(--bg) 65%);
    font-family: 'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 60px 20px;
  }

  .stage{ position:relative; width: 640px; max-width: 100%; height: 480px; }

  svg.lines{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }

  .path{ fill:none; stroke-width: 1.4; opacity: .28; }

  .node-wrap{
    position:absolute;
    opacity: 0;
    transform: translateY(10px) scale(.95);
  }
  .node-wrap.in{ animation: rise .55s cubic-bezier(.2,.7,.2,1) forwards; }

  .node{
    position: relative;
    z-index: 1;
    padding: 15px 21px;
    border-radius: 12px;
    /* Royal Cobalt — trying this option per request */
    background:
      linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.02) 55%),
      linear-gradient(150deg, #1E4FD9, #0A1E5C);
    border: 1px solid rgba(255,255,255,.14);
    color: var(--text);
    font-weight: 600;
    font-size: 14.5px;
    letter-spacing: -0.01em;
    white-space: nowrap;
    box-shadow:
      0 14px 34px -14px rgba(0,0,0,.6),
      inset 0 1px 0 rgba(255,255,255,.08);
    transition: transform .25s ease, border-color .25s ease;
  }

  .node::before{
    content:'';
    position:absolute;
    left: 21px; top: -1px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--dot);
    box-shadow: 0 0 8px 1px var(--dot);
    transform: translateY(-50%);
    z-index: 2;
  }

  .node-wrap:hover .node{
    transform: translateY(-3px);
    border-color: var(--dot);
  }

  /* Thin edge strips — back to the v6 thickness (2px), not the thicker
     3px version. */
  .edge{
    position:absolute;
    background: var(--dot);
    opacity: 0;
    border-radius: 2px;
    filter: drop-shadow(0 0 9px var(--dot)) drop-shadow(0 0 4px var(--dot));
    pointer-events: none;
  }
  .edge-top   { top: -1px; left: 10px; right: 10px; height: 1px; }
  .edge-right { top: 10px; right: -1px; bottom: 10px; width: 1px; }
  .edge-bottom{ bottom: -1px; left: 10px; right: 10px; height: 1px; }
  .edge-left  { top: 10px; left: -1px; bottom: 10px; width: 1px; }

  /* Staggered edge pattern, same as v6. But the flash itself now snaps to
     full brightness almost instantly (quick attack), then eases back down
     slowly — "foran roshan, phir dheere se dheem" instead of a slow rise. */
  .node.pulse .edge-top{    animation: edge-flash 1.4s ease-in-out; animation-delay: 0s; }
  .node.pulse .edge-right{  animation: edge-flash 1.4s ease-in-out; animation-delay: .12s; }
  .node.pulse .edge-bottom{ animation: edge-flash 1.4s ease-in-out; animation-delay: .24s; }
  .node.pulse .edge-left{   animation: edge-flash 1.4s ease-in-out; animation-delay: .36s; }

  @keyframes edge-flash{
    0%{ opacity: 0; }
    22%{ opacity: 1; }
    100%{ opacity: 0; }
  }

  .node.pulse::before{
    animation: bulb-flash 1.4s ease-in-out;
  }
  @keyframes bulb-flash{
    0%{ box-shadow: 0 0 8px 1px var(--dot); }
    22%{ box-shadow: 0 0 28px 10px var(--dot), 0 0 12px 3px var(--dot); }
    100%{ box-shadow: 0 0 8px 1px var(--dot); }
  }

  /* Text glows along with the bulb + edges, same timing. */
  .node.pulse{
    animation: text-flash 1.4s ease-in-out;
  }
  @keyframes text-flash{
    0%{ color: var(--text); }
    22%{ color: var(--dot); }
    100%{ color: var(--text); }
  }

  /* Same lit-up state on hover (desktop) / touch (mobile). */
  .node:hover .edge,
  .node.touch-active .edge{
    opacity: 1;
    animation: none;
  }
  .node:hover::before,
  .node.touch-active::before{
    box-shadow: 0 0 14px 4px var(--dot);
    animation: none;
  }
  .node:hover,
  .node.touch-active{
    color: var(--dot); /* text highlight now matches bulb + edges on hover/touch too */
  }

  @keyframes rise{ to{ opacity:1; transform: translateY(0) scale(1); } }

  .n-publisher{ top: -8px;  left: 2px;   --dot: var(--c-publisher); }
  .n-content  { top: 90px;  left: 120px; --dot: var(--c-content);   }
  .n-editorial{ top: 178px; left: 342px; --dot: var(--c-editorial); }
  .n-website  { top: 332px; left: 342px; --dot: var(--c-website);   }
  .n-authority{ top: 382px; left: 4px;   --dot: var(--c-authority); }
</style>
</head>
<body>

<div class="stage" id="stage">
  <svg class="lines" id="lines" viewBox="0 0 640 480" preserveAspectRatio="none">
    <circle id="traveling-dot" r="1.1"></circle>
  </svg>

  <div class="node-wrap n-publisher" id="publisher-wrap" style="animation-delay:.05s">
    <div class="node" id="publisher">Publisher
      <span class="edge edge-top"></span><span class="edge edge-right"></span>
      <span class="edge edge-bottom"></span><span class="edge edge-left"></span>
    </div>
  </div>
  <div class="node-wrap n-content" id="content-wrap" style="animation-delay:.2s">
    <div class="node" id="content">Content
      <span class="edge edge-top"></span><span class="edge edge-right"></span>
      <span class="edge edge-bottom"></span><span class="edge edge-left"></span>
    </div>
  </div>
  <div class="node-wrap n-editorial" id="editorial-wrap" style="animation-delay:.35s">
    <div class="node" id="editorial">Editorial Link
      <span class="edge edge-top"></span><span class="edge edge-right"></span>
      <span class="edge edge-bottom"></span><span class="edge edge-left"></span>
    </div>
  </div>
  <div class="node-wrap n-website" id="website-wrap" style="animation-delay:.5s">
    <div class="node" id="website">Your Website
      <span class="edge edge-top"></span><span class="edge edge-right"></span>
      <span class="edge edge-bottom"></span><span class="edge edge-left"></span>
    </div>
  </div>
  <div class="node-wrap n-authority" id="authority-wrap" style="animation-delay:.65s">
    <div class="node" id="authority">Authority
      <span class="edge edge-top"></span><span class="edge edge-right"></span>
      <span class="edge edge-bottom"></span><span class="edge edge-left"></span>
    </div>
  </div>
</div>

<script>
  // Publisher -> Content -> Editorial Link -> Your Website -> Authority
  const SPEED_PX_PER_SEC = 20;  // ONE uniform speed for the entire line —
                                 // no fast zones near any box, per feedback
  const PAUSE_MS = 500;

  // FIX: the last entry previously said var(--c-authority) here — the dot
  // would show Authority's color while still leaving the Website box. It
  // must show the FROM node's own color (--c-website) instead.
  const connections = [
    ['publisher', 'content',   'var(--c-publisher)'],
    ['content',   'editorial', 'var(--c-content)'],
    ['editorial', 'website',   'var(--c-editorial)'],
    ['website',   'authority', 'var(--c-website)'],
  ];

  const segmentPaths = [];

  // Fixed anchor point per box (the bulb's position on the top edge) used
  // for BOTH arriving at and leaving a box — removes any jolt between
  // segments. Straight lines (not curves) so the dot's path never dips
  // back across a box it just left.
  function anchorPoint(el, stageRect){
    const r = el.getBoundingClientRect();
    return { x: r.left - stageRect.left + 25, y: r.top - stageRect.top };
  }

  function draw(){
    const svg = document.getElementById('lines');
    const stage = document.getElementById('stage');
    const stageRect = stage.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${stageRect.width} ${stageRect.height}`);

    const dot = document.getElementById('traveling-dot');
    Array.from(svg.querySelectorAll('path')).forEach(p => p.remove());
    segmentPaths.length = 0;

    connections.forEach(([fromId, toId, color]) => {
      const fromEl = document.getElementById(fromId);
      const toEl = document.getElementById(toId);

      const p1 = anchorPoint(fromEl, stageRect);
      const p2 = anchorPoint(toEl, stageRect);

      const d = `M${p1.x},${p1.y} L${p2.x},${p2.y}`; // straight line

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      path.setAttribute('class', 'path');
      path.setAttribute('stroke', color);
      svg.insertBefore(path, dot);

      segmentPaths.push({ pathEl: path, color, toId });
    });
  }

  function triggerPulse(id){
    const el = document.getElementById(id);
    el.classList.remove('pulse');
    void el.offsetWidth;
    el.classList.add('pulse');
  }

  let segmentIndex = 0;
  let segmentStart = 0;
  let paused = false;
  let publisherPulsedThisLap = false; // tracked separately, not via setTimeout,
                                       // so it can never race with load timing

  // Maps elapsed time -> distance travelled along the path, using a single
  // uniform speed (SPEED_PX_PER_SEC) for the WHOLE line, wrapped in a gentle
  // ease-in-out so it still glides gracefully rather than moving mechanically
  // — but the box-to-box average pace is exactly the same everywhere.
  function easeInOutSine(x){
    return -(Math.cos(Math.PI * x) - 1) / 2;
  }

  function animate(now){
    const seg = segmentPaths[segmentIndex];
    if (!seg){ requestAnimationFrame(animate); return; }

    // Publisher is always the FROM node, never a toId, so it never received
    // triggerPulse otherwise. Fire it the instant segment 0 actually starts
    // running — first lap AND every restart — instead of guessing a delay.
    if (segmentIndex === 0 && !publisherPulsedThisLap){
      triggerPulse('publisher');
      publisherPulsedThisLap = true;
    }

    const len = seg.pathEl.getTotalLength();
    const segmentMs = (len / SPEED_PX_PER_SEC) * 1000; // one uniform speed, no zones
    if (!segmentStart) segmentStart = now;
    if (paused){ requestAnimationFrame(animate); return; }

    const elapsed = now - segmentStart;
    const linearT = Math.min(elapsed / segmentMs, 1);
    const t = easeInOutSine(linearT); // gentle glide, same pace start-to-end
    const pt = seg.pathEl.getPointAtLength(t * len);

    const dot = document.getElementById('traveling-dot');
    dot.setAttribute('cx', pt.x);
    dot.setAttribute('cy', pt.y);
    dot.setAttribute('fill', seg.color);
    dot.style.filter = `drop-shadow(0 0 3px ${seg.color})`;

    if (linearT >= 1){
      triggerPulse(seg.toId); // fires exactly when the dot reaches the bulb
      segmentIndex++;
      segmentStart = now;

      if (segmentIndex >= segmentPaths.length){
        paused = true;
        setTimeout(() => {
          segmentIndex = 0;
          segmentStart = 0;
          paused = false;
          publisherPulsedThisLap = false; // allow Publisher to pulse again next lap
        }, PAUSE_MS);
      }
    }

    requestAnimationFrame(animate);
  }

  window.addEventListener('DOMContentLoaded', () => {
    draw(); // first pass — positions may be slightly off pre-entrance, corrected below
    const wraps = document.querySelectorAll('.node-wrap');
    wraps.forEach(el => el.classList.add('in'));

    // The REAL fix: redraw once every entrance animation has actually
    // finished (not a guessed delay) — "Authority" is the last to settle
    // (.65s delay + .55s duration ≈ 1.2s), so a fixed 600ms redraw was
    // firing before it was done, leaving lines fractionally misaligned.
    let finishedCount = 0;
    wraps.forEach(el => {
      el.addEventListener('animationend', () => {
        finishedCount++;
        if (finishedCount === wraps.length) draw(); // all settled — final, accurate redraw
      }, { once: true });
    });

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(draw); // also correct for late-loading font metrics
    }

    requestAnimationFrame(animate);

    document.querySelectorAll('.node').forEach(node => {
      node.addEventListener('touchstart', () => node.classList.add('touch-active'), { passive: true });
      node.addEventListener('touchend', () => node.classList.remove('touch-active'));
      node.addEventListener('touchcancel', () => node.classList.remove('touch-active'));
    });
  });
  window.addEventListener('resize', draw);
</script>

</body>
</html>
